[project]
name = "equa-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noel Jendestig", email = "noeljendestig@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "pdfminer-six>=20260107",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
equa-backend = "equa_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
